<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="t d">
  <title id="t">Ilustração de um fluxo de automação</title>
  <desc id="d">Um fluxo central conecta quatro elementos: e-mail recebido, pasta de arquivos, calendário e aplicativo de notificações. Linhas tracejadas mostram as informações circulando entre eles.</desc>
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#142B50" flood-opacity="0.12"/>
    </filter>
    <style>
      .line { fill: none; stroke: #93C5FD; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }
      .line--p { stroke: #C4B5FD; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .label { font: 600 15px Poppins, 'Segoe UI', Arial, sans-serif; fill: #142B50; }
      .sub { font: 500 12px Inter, 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .ico { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .pulse { transform-origin: 280px 210px; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%, 100% { opacity: .18; transform: scale(1); } 50% { opacity: .05; transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { .line, .pulse { animation: none; } }
    </style>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="560" height="420" rx="20" fill="#F8FAFC"/>
  <g fill="#E2E8F0">
    <circle cx="40" cy="30" r="2"/><circle cx="70" cy="30" r="2"/><circle cx="100" cy="30" r="2"/>
    <circle cx="460" cy="390" r="2"/><circle cx="490" cy="390" r="2"/><circle cx="520" cy="390" r="2"/>
  </g>

  <!-- Conectores -->
  <path class="line" d="M190 105 C 240 105, 240 170, 245 180"/>
  <path class="line line--p" d="M370 105 C 320 105, 320 170, 315 180"/>
  <path class="line line--p" d="M190 315 C 240 315, 240 250, 245 240"/>
  <path class="line" d="M370 315 C 320 315, 320 250, 315 240"/>

  <!-- Núcleo do fluxo -->
  <circle class="pulse" cx="280" cy="210" r="78" fill="#8B5CF6" opacity=".15"/>
  <circle cx="280" cy="210" r="56" fill="url(#hub)" filter="url(#shadow)"/>
  <path d="M286 180 L266 214 H281 L274 240 L296 204 H281 Z" fill="#FFFFFF"/>
  <rect x="236" y="276" width="88" height="26" rx="13" fill="#142B50"/>
  <text x="280" y="294" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Seu fluxo</text>

  <!-- E-mail (gatilho) -->
  <g filter="url(#shadow)">
    <rect class="card" x="30" y="70" width="160" height="70" rx="14"/>
  </g>
  <rect x="44" y="84" width="42" height="42" rx="10" fill="#EFF6FF"/>
  <g class="ico" stroke="#2563EB">
    <rect x="53" y="95" width="24" height="18" rx="3"/>
    <path d="M53 98 L65 106 L77 98"/>
  </g>
  <text class="label" x="96" y="102">E-mail</text>
  <text class="sub" x="96" y="120">Nova mensagem</text>

  <!-- Arquivos -->
  <g filter="url(#shadow)">
    <rect class="card" x="370" y="70" width="160" height="70" rx="14"/>
  </g>
  <rect x="384" y="84" width="42" height="42" rx="10" fill="#F5F3FF"/>
  <g class="ico" stroke="#6D28D9">
    <path d="M393 99 a2 2 0 0 1 2 -2 h6 l3 3 h10 a2 2 0 0 1 2 2 v11 a2 2 0 0 1 -2 2 h-19 a2 2 0 0 1 -2 -2 z"/>
  </g>
  <text class="label" x="436" y="102">Arquivos</text>
  <text class="sub" x="436" y="120">Salvo na pasta</text>

  <!-- Notificações / apps -->
  <g filter="url(#shadow)">
    <rect class="card" x="30" y="280" width="160" height="70" rx="14"/>
  </g>
  <rect x="44" y="294" width="42" height="42" rx="10" fill="#F5F3FF"/>
  <g class="ico" stroke="#6D28D9">
    <path d="M57 318 v-5 a8 8 0 0 1 16 0 v5 l2 4 h-20 z"/>
    <path d="M62 325 a3 3 0 0 0 6 0"/>
  </g>
  <text class="label" x="96" y="312">Aplicativos</text>
  <text class="sub" x="96" y="330">Aviso enviado</text>

  <!-- Calendário -->
  <g filter="url(#shadow)">
    <rect class="card" x="370" y="280" width="160" height="70" rx="14"/>
  </g>
  <rect x="384" y="294" width="42" height="42" rx="10" fill="#EFF6FF"/>
  <g class="ico" stroke="#2563EB">
    <rect x="394" y="304" width="22" height="22" rx="3"/>
    <path d="M394 311 h22 M400 301 v6 M410 301 v6"/>
  </g>
  <text class="label" x="436" y="312">Calendário</text>
  <text class="sub" x="436" y="330">Lembrete criado</text>

  <!-- Selos de status -->
  <g>
    <circle cx="183" cy="76" r="11" fill="#2563EB"/>
    <text x="183" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <circle cx="523" cy="76" r="11" fill="#15803D"/>
    <path d="M518 76 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="183" cy="286" r="11" fill="#15803D"/>
    <path d="M178 286 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="523" cy="286" r="11" fill="#15803D"/>
    <path d="M518 286 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
